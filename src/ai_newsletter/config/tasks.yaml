research_task:
  description: >
    Search the web and arxiv for the top 5 AI/ML papers or major model releases
    published THIS WEEK on the topic: {topic}.

    Search strategy — run ALL of these queries:
      1. "arxiv {topic} {current_year} new paper"
      2. "{topic} research paper this week site:arxiv.org"
      3. "{topic} model release {current_year}"
      4. Use the arxiv_search tool directly with query: "{topic}"

    For each result, collect:
      - Full paper title (exact, no paraphrasing)
      - Author names (first 3 then "et al." if more)
      - Direct arxiv or paper URL (NOT a Google search URL)
      - One sentence: what makes this paper stand out THIS week?

    HARD RULES:
      - Only include papers published in the last 7 days
      - Never fabricate a paper title or URL
      - If unsure about a URL, search again to verify it
      - Prefer papers with open-source code or models when possible
  expected_output: >
    A numbered list of 3–5 real papers. For each:
      1. Title (exact)
      2. Authors
      3. URL (direct link, verified)
      4. Why it matters (1 sentence, specific — cite numbers if available)
  agent: researcher

