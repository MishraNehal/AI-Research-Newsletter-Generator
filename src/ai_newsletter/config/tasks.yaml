summarization_task:
  description: >
    For each paper from the researcher, write a structured summary using this
    EXACT markdown format — do not deviate:

    ### [Exact Paper Title]
    *[Authors] · [URL]*
    **Tags:** [2–3 tags from: Reasoning, RLHF, Alignment, Multimodal, Efficiency,
               Architecture, Training, Inference, Agents, RAG, Safety, Vision, Code]

    **What they did:** [1 sentence — specific, name the model/method/dataset]
    **How:** [1 sentence — key technique, innovation, or experimental setup]
    **Why it matters:** [1 sentence — practical implication for ML practitioners today]

    ---

    Repeat this block for every paper. Do not merge papers. Do not skip the URL.
    Be specific — cite benchmark numbers, model names, and dataset names when available.
    Avoid: "novel approach", "promising results", "significant improvement" without numbers.
  expected_output: >
    3–5 paper summary blocks, each in the exact markdown format above.
    Each block must have: title, authors, URL, tags, and all 3 labelled sentences.
  agent: summarizer

newsletter_task:
  description: >
    Assemble the paper summaries into a complete weekly newsletter in markdown.

    REQUIRED STRUCTURE (in this exact order):

    # The AI Weekly Digest
    **Issue · [current date] · {topic} Edition · ~[X] min read**

    ---

    [INTRO — 3 sentences max]
    Find the ONE theme connecting this week's papers. State it boldly in sentence 1.
    Sentence 2 gives a specific example from one paper. Sentence 3 sets up what's below.
    Do NOT start with "This week" or "In the world of AI".

    ---

    ## This Week's Papers

    [Paste all summaries from the summarizer here, keeping their markdown format]

    ---

    ## Closing Thought

    [2–3 sentences. What do this week's papers collectively signal about where {topic}
    research is heading in the next 6 months? Be specific and opinionated.
    Do not summarize the papers again — that was already done above.]

    ---
    *Generated by AI Newsletter Crew · Powered by CrewAI*

    TONE RULES:
    - Write like a senior ML engineer explaining to peers, not a press release
    - No filler phrases ("It is worth noting", "In conclusion", "Exciting times")
    - If a claim is vague, make it specific or cut it
    - Aim for 450–600 words total
  expected_output: >
    A complete markdown newsletter with all 5 sections above.
    Saved to outputs/newsletter.md. Minimum 450 words.
  agent: editor
  output_file: outputs/newsletter.md
  markdown: true