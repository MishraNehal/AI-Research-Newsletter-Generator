services:
  - type: web
    name: ai-newsletter-crew
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: GROQ_API_KEY
        sync: false        # you'll enter this manually in Render dashboard
      - key: SERPER_API_KEY
        sync: false
      - key: MODEL
        value: groq/llama-3.3-70b-versatile
      - key: CREWAI_TELEMETRY_OPT_OUT
        value: "true"